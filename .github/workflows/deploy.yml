name: Deploy to Bluehost VPS

on:
  push:
    branches:
      - main # Triggers when you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to VPS via rsync
        run: |
          # Copies everything to a 'purrkins-app' folder on your server
          rsync -avz --delete --exclude='.git' --exclude='node_modules' ./ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:~/purrkins-app/

      - name: Start Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/purrkins-app
            # Create a dummy .env if it doesn't exist so docker-compose doesn't fail
            touch .env
            
            # Stop the old container, build the new image, and start it
            docker compose up --build -d
            
            # Prune old images to save disk space on the server
            docker image prune -f
