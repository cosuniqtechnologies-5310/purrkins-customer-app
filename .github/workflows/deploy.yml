name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # Triggers when you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY || secrets.VPS_SSH_KEY }}
          
      - name: Add AWS EC2 to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.VPS_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT || secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p $EC2_PORT -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to AWS EC2 via rsync (Purrkins App only, no theme)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.VPS_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          EC2_PORT: ${{ secrets.EC2_PORT || secrets.VPS_PORT || '22' }}
        run: |
          # Copies only the Purrkins App to ~/purrkins-app/ on EC2 (strictly excludes theme, git, and local node_modules)
          rsync -avz --delete \
            -e "ssh -p $EC2_PORT -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='theme' \
            --exclude='theme/**' \
            ./ $EC2_USER@$EC2_HOST:~/purrkins-app/

      - name: Start Docker containers on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.EC2_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || secrets.VPS_PORT || 22 }}
          script: |
            cd ~/purrkins-app
            # Create a dummy .env if it doesn't exist so docker-compose doesn't fail
            touch .env
            
            # Stop the old container, build the new image, and start it
            docker compose up --build -d
            
            # Prune old images to save disk space on the EC2 instance
            docker image prune -f
