# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c48f3f570d623330d23274556ccc823f"
name = "purrkins-customer-app"
application_url = "https://purrkins.duckdns.org"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_customers,write_metaobjects,read_metaobject_definitions,read_files,write_files,read_orders,write_own_subscription_contracts,read_own_subscription_contracts,read_customer_payment_methods,write_purchase_options,read_purchase_options"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/create"
  topics = [ "subscription_contracts/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/update"
  topics = [ "subscription_contracts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[app_proxy]
url = "https://purrkins.duckdns.org/api/free-sample"
subpath = "purrkins"
prefix = "apps"

[auth]
redirect_urls = [ "https://purrkins.duckdns.org/api/auth" ]

[build]
automatically_update_urls_on_dev = true
